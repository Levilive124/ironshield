<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090c11">
  <meta name="description" content="Verwalte den Status und die Einstellungen deines Discord-Servers.">
  <title>Server-Dashboard · Iron Shield</title>
  <link rel="icon" type="image/svg+xml" href="/assets/ironshield-logo.svg?v=20261004-is-monogram">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="dashboard-page">
  <main class="section-wrap dashboard-section">
    <header class="dashboard-heading">
      <div><div class="eyebrow dashboard-eyebrow"><img src="/assets/ironshield-logo.svg?v=20261004-is-monogram" alt="">IRON SHIELD · DASHBOARD</div><h1>Deine <span>Server.</span></h1><p>Bot-Status und Einstellungen für deine Discord-Server.</p></div>
      <div class="user-chip"><span id="dashboard-user"></span><form method="post" action="/api/index.php?route=logout"><input type="hidden" name="csrf" value=""><button class="logout-button" type="submit">Abmelden</button></form></div>
    </header>
    <div class="dashboard-connection is-offline" id="dashboard-connection" role="status"><span class="dashboard-connection-dot"></span><div><strong id="dashboard-connection-title">Dashboard wird geladen</strong><small id="dashboard-connection-detail">Bitte einen Moment warten.</small></div></div>
    <p class="dashboard-message" id="dashboard-message" hidden></p>
    <div id="dashboard-content" aria-live="polite"><p class="dashboard-message">Serverliste wird geladen …</p></div>
  </main>
  <script src="/assets/dashboard.js" defer></script>
</body>
</html>
